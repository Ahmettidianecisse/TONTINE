<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Bakéli-tontine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">

    <div class="flex w-full max-w-6xl shadow-2xl rounded-3xl bg-white overflow-hidden">
        
        <div class="hidden lg:flex lg:w-5/12 bg-custom-blue relative p-12 flex-col justify-center items-center sidebar-rounded">
            <h1 class="text-3xl font-bold text-white mb-6">Bakéli-tontine</h1>
            <div class="relative w-full max-w-sm h-96 flex items-center justify-center">
                <p class="text-white text-center absolute"><img src="../Asset/connexion.png" alt=""></p>
            </div>
        </div>

        <div class="w-full lg:w-7/12 p-8 sm:p-12 md:p-16 flex flex-col items-center justify-center">
            
            <h1 class="text-3xl font-bold text-custom-blue mb-4 text-center">Bienvenue sur Bakéli-tontine</h1>
            <h2 class="text-3xl font-semibold text-gray-800 mb-2 text-center">Connectez-vous</h2>
            <p class="text-gray-600 mb-8 text-center">Connectez-vous et gérez vos cotisations</p>

            <form id="loginForm" class="w-full max-w-sm space-y-6" novalidate>
                
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700">E-mail</label>
                    <input type="email" id="email" name="email" required
                            class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-3 px-4 focus:outline-none focus:ring-blue-500 focus:border-blue-500 text-lg"
                            placeholder="Entrez votre adresse e-mail">
                    <p class="text-sm text-red-600 mt-1 hidden" id="error-email">Veuillez entrer un e-mail valide.</p>
                </div>

                <div>
                    <label for="mot_de_passe" class="block text-sm font-medium text-gray-700">Mot de passe</label>
                    <input type="password" id="mot_de_passe" name="mot_de_passe" required
                            class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-3 px-4 focus:outline-none focus:ring-blue-500 focus:border-blue-500 text-lg"
                            placeholder="Entrez votre mot de passe">
                    <p class="text-sm text-red-600 mt-1 hidden" id="error-mot_de_passe">Le mot de passe est requis et doit avoir min. 8 caractères.</p>
                </div>

                <div class="text-right">
                    <a href="MPO.html" class="text-sm font-medium text-gray-600 hover:text-custom-blue">Mot de passe oublié?</a>
                </div>

                <div class="pt-2">
                    <button type="submit" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-md shadow-lg text-lg font-medium text-white bg-custom-green hover:bg-custom-green-dark focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-custom-green transition duration-150">
                        Connexion
                     </button>
                </div>
            </form>

            <p class="mt-8 text-gray-600 text-md">Vous n’avez pas de compte, 
                <a href="inscription.html" class="text-custom-blue font-bold hover:underline">inscrivez-vous!</a>
            </p>
            
        </div>
    </div>
    <script type="module" src="../js/connexion.js"></script>
    <script type="module" src="../js/protect.js"></script>
    <script type="module" src="../js/connexion.js"></script>
</body>
</html>
