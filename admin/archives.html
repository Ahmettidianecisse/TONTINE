<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bakéli Tontine - Archives</title>
  <link rel="stylesheet" href="/css/dashordadmin.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">

  <!-- Sidebar -->
  <div id="sidebar" class="fixed inset-y-0 left-0 z-40 w-64 transform -translate-x-full md:translate-x-0 transition-transform duration-300 bg-[#0A3545] flex flex-col">
    <div class="flex items-center justify-center h-16 border-b border-gray-700">
      <span class="text-white font-bold uppercase">Bakeli Tontine</span>
    </div>
    <nav class="flex-1 px-2 py-4 overflow-y-auto">
      <a href="dasboard.html" class="flex items-center px-4 py-2 text-gray-100 hov rounded">
        <i class="bi bi-list mr-2"></i> Dashboard
      </a>
      <a href="Utilisateur.html" class="flex items-center px-4 py-2 mt-2 text-gray-100 hov rounded">
        <i class="bi bi-person mr-2"></i> Utilisateur
      </a>
      <a href="cotisation.html" class="flex items-center px-4 py-2 mt-2 text-gray-100 hov rounded">
        <i class="bi bi-currency-dollar mr-2"></i> Cotisation
      </a>

      <div class="text-white mt-2">
        <button onclick="toggleMenu()" class="flex items-center justify-between w-full px-4 py-2 rounded">
          <span class="flex items-center gap-2 hov">⚙️ Paramètres</span>
          <span id="arrow" class="transition-transform"><i class="bi bi-caret-down-fill"></i></span>
        </button>
        <!-- Sous-menu -->
        <div id="submenu" class="hidden flex-col ml-6">
          <a href="parametre.html" class="block px-4 py-2 hov rounded">Paramètres Généraux</a>
          <a href="utilisateurparametre.html" class="block px-4 py-2 hov rounded">Utilisateurs</a>
          <a href="archives.html" class="block px-4 py-2 hov rounded">Archives</a>
          <a href="bloques.html" class="block px-4 py-2 hov rounded">Membres Bloqués</a>
        </div>
      </div>
    </nav>
  </div>

  <!-- Contenu principal -->
  <div class="flex-1 flex flex-col md:ml-64">

    <!-- Header -->
    <div class="flex items-center justify-between p-4 bg-white shadow-md">
      <button id="menu-btn" class="md:hidden text-gray-800 text-2xl">
        <i class="bi bi-list"></i>
      </button>
      <h1 class="text-lg sm:text-xl md:text-2xl font-bold">Archives</h1>
    </div>

    <!-- Contenu principal centré -->
    <main class="flex-1 min-h-screen flex items-center justify-center p-6">
      <!-- Tableau Archives -->
      <div class="bg-white rounded-lg shadow p-6 w-full max-w-4xl overflow-x-auto">
        <h2 class="text-xl font-semibold mb-4 text-center">10 Membres Archivés</h2>

        <table class="w-full border-collapse text-sm sm:text-base">
          <thead>
            <tr class="bg-green-500 text-white">
              <th class="py-2 px-4 text-left">Membres</th>
              <th class="py-2 px-4 text-left">Date début</th>
              <th class="py-2 px-4 text-left">Actions</th>
            </tr>
          </thead>
          <tbody class="divide-y">
            <tr>
              <td class="py-2 px-4">Selena Roy</td>
              <td class="py-2 px-4">01/01/2022</td>
              <td class="py-2 px-4 flex space-x-3">
                <button class="text-gray-600 hover:text-black"><i class="bi bi-eye"></i></button>
                <button class="text-green-600 hover:text-green-800"><i class="bi bi-lock"></i></button>
              </td>
            </tr>
            <tr>
              <td class="py-2 px-4">Emma Watson</td>
              <td class="py-2 px-4">01/01/2022</td>
              <td class="py-2 px-4 flex space-x-3">
                <button class="text-gray-600 hover:text-black"><i class="bi bi-eye"></i></button>
                <button class="text-green-600 hover:text-green-800"><i class="bi bi-lock"></i></button>
              </td>
            </tr>
            <tr>
              <td class="py-2 px-4">Jhon Robert</td>
              <td class="py-2 px-4">01/01/2022</td>
              <td class="py-2 px-4 flex space-x-3">
                <button class="text-gray-600 hover:text-black"><i class="bi bi-eye"></i></button>
                <button class="text-green-600 hover:text-green-800"><i class="bi bi-lock"></i></button>
              </td>
            </tr>
          </tbody>
        </table>

        <!-- Pagination -->
        <div class="flex justify-between items-center mt-4 text-sm text-gray-600">
          <button class="flex items-center gap-1 hover:text-black">
            <i class="bi bi-arrow-left"></i><span class="hidden sm:inline">Previous</span>
          </button>
          <div class="flex items-center space-x-2">
            <span class="w-6 h-6 flex items-center justify-center bg-green-500 text-white rounded-full">1</span>
            <span class="cursor-pointer hover:text-green-600">2</span>
          </div>
          <button class="flex items-center gap-1 hover:text-black">
            <span class="hidden sm:inline">Next</span><i class="bi bi-arrow-right"></i>
          </button>
        </div>
      </div>
    </main>
  </div>

  <script src="/js/archives.js"></script>
</body>
</html>
