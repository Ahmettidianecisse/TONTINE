<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Utilisateur</title>
  <link rel="stylesheet" href="/css/dashordadmin.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body class="bg-gray-100">

  <!-- Sidebar -->
  <nav>
    <div id="sidebar" class="fixed inset-y-0 left-0 z-40 w-64 transform -translate-x-full md:translate-x-0 transition-transform bg-[#0A3545] flex flex-col">
      <div class="flex items-center justify-center h-16 border-b border-gray-700">
        <span class="text-white font-bold uppercase">Bakeli Tontine</span>
      </div>

      <nav class="flex-1 px-2 py-4 overflow-y-auto">
        <a href="dasboard.html" class="flex items-center px-4 py-2 text-gray-100 hov">
          <i class="bi bi-list h-6 w-6 mr-2"></i> Dashboard
        </a>
        <a href="Utilisateur.html" class="flex items-center px-4 py-2 mt-2 text-gray-100 hov">
          <i class="bi bi-person h-6 w-6 mr-2"></i> Utilisateur
        </a>
        <a href="cotisation.html" class="flex items-center px-4 py-2 mt-2 text-gray-100 hov">
          <i class="bi bi-currency-dollar h-6 w-6 mr-2"></i> Cotisation
        </a>

        <div class="text-white">
          <button onclick="toggleMenu()" class="flex items-center justify-between w-full px-4 py-2 hov">
            <span class="flex items-center gap-2">⚙️ Paramètres</span>
            <span id="arrow" class="transition-transform"><i class="bi bi-caret-down-fill"></i></span>
          </button>
          <div id="submenu" class="hidden flex-col ml-6">
            <a href="/js/utilisateurparametre.js" class="block px-4 py-2 hov">Paramètres Généraux</a>
            <a href="utilisateurparametre.html" class="block px-4 py-2 hov">Utilisateurs</a>
            <a href="archives.html" class="block px-4 py-2 hov">Archives</a>
            <a href="bloques.html" class="block px-4 py-2 hov">Membres Bloqués</a>
          </div>
        </div>
      </nav>
    </div>
  </nav>

  <!-- Modal -->
  <div id="modal" class="fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center hidden">
    <div class="bg-white w-full max-w-[95%] sm:w-[700px] rounded-xl shadow-lg p-6 relative">
      <button id="closeModal" class="absolute top-2 right-2 text-gray-500 hover:text-black text-xl">✖</button>
      <h2 class="text-2xl font-bold text-center mb-6">Ajouter un membre</h2>

      <form id="formMembre" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div><label class="block text-sm">Nom</label><input type="text" id="nom" class="w-full border rounded p-2"></div>
        <div><label class="block text-sm">Prénom</label><input type="text" id="prenom" class="w-full border rounded p-2"></div>
        <div><label class="block text-sm">Date de naissance</label><input type="date" id="naissance" class="w-full border rounded p-2"></div>
        <div><label class="block text-sm">Profession</label><input type="text" id="profession" class="w-full border rounded p-2"></div>
        <div><label class="block text-sm">E-mail</label><input type="email" id="email" class="w-full border rounded p-2"></div>
        <div><label class="block text-sm">Téléphone</label><input type="tel" id="tel" class="w-full border rounded p-2"></div>
        <div><label class="block text-sm">Adresse</label><input type="text" id="adresse" class="w-full border rounded p-2"></div>
        <div><label class="block text-sm">Organisation</label><input type="text" id="organisation" class="w-full border rounded p-2"></div>
      </form>

      <div class="mt-6 text-center">
        <button id="ajouterMembre" class="bg-green-500 text-white px-8 py-2 rounded-lg shadow hover:bg-green-600">
          Ajouter
        </button>
      </div>
    </div>
  </div>

  <!-- Contenu principal -->
  <div class="flex-1 flex flex-col md:ml-64">
    <div class="flex items-center justify-between p-4 bg-white shadow-md">
      <button id="menu-btn" class="md:hidden text-gray-800 text-2xl"><i class="bi bi-list"></i></button>
      <h1 class="text-2xl font-bold">Utilisateur</h1>
    </div>

    <div class="grid gap-6 p-6">
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
        <div class="shadow-lg bg-white text-center p-8 text-sm rounded-xl hov" id="actifs">Membres Actifs: 0</div>
        <div class="shadow-lg bg-white text-center p-8 text-sm rounded-xl hov" id="bloques">Membres Bloqués: 0</div>
        <div class="shadow-lg bg-white text-center p-8 text-sm rounded-xl hov" id="tous">Total Effectif: 0</div>
      </div>

      <div class="flex justify-end mt-4">
        <button id="openModal" class="bg-[#0A3545] text-white px-6 py-2 rounded-lg shadow hover:bg-[#145067]">Ajouter</button>
      </div>
    </div>

    <div class="p-6 overflow-x-auto">
      <table class="table-auto w-full border rounded-xl shadow-lg text-sm">
        <thead class="bg-green-400 text-white">
          <tr>
            <th class="p-2">Membre</th>
            <th class="p-2">Date début</th>
            <th class="p-2">Seuil</th>
            <th class="p-2">Progression</th>
            <th class="p-2">Statut</th>
          </tr>
        </thead>
        <tbody id="table-body" class="text-center"></tbody>
      </table>
    </div>
  </div>

  <!-- Firebase et Script -->
  <script type="module" src="/js/utilisateur.js"></script>
</body>
</html>
