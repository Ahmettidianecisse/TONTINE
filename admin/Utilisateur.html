<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Utilisateur</title>
  <link rel="stylesheet" href="/css/dashordadmin.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">

  <!-- Sidebar simplifié -->
  <div id="sidebar" class="fixed inset-y-0 left-0 z-40 w-64 transform -translate-x-full md:translate-x-0 transition-transform duration-300 bg-[#0A3545] flex flex-col">
    <div class="flex items-center justify-center h-16 border-b border-gray-700">
      <span class="text-white font-bold uppercase">Bakeli Tontine</span>
    </div>

<nav class="flex-1 px-2 py-4 overflow-y-auto">
  <a href="dasboard.html" class="flex items-center px-4 py-2 text-gray-100 hov rounded">
    <i class="bi bi-list mr-2"></i> Dashboard
  </a>
  <a href="Utilisateur.html" class="flex items-center px-4 py-2 mt-2 text-gray-100 hov rounded">
    <i class="bi bi-person mr-2"></i> Utilisateur
  </a>
  <a href="cotisation.html" class="flex items-center px-4 py-2 mt-2 text-gray-100 hov rounded">
    <i class="bi bi-currency-dollar mr-2"></i> Cotisation
  </a>

  <div class="text-white mt-2">
    <button onclick="toggleMenu()" class="flex items-center justify-between w-full px-4 py-2 hov rounded">
      <span class="flex items-center gap-2 hov">⚙️ Paramètres</span>
      <span id="arrow" class="transition-transform"><i class="bi bi-caret-down-fill"></i></span>
    </button>
    <!-- Sous-menu -->
    <div id="submenu" class="hidden flex-col ml-6">
      <a href="parametre.html" class="block px-4 py-2 hov rounded">Paramètres Généraux</a>
      <a href="utilisateurparametre.html" class="block px-4 py-2 hov rounded">Utilisateurs</a>
      <a href="archives.html" class="block px-4 py-2 hov rounded">Archives</a>
      <a href="bloques.html" class="block px-4 py-2 hov rounded">Membres Bloqués</a>
    </div>
  </div>
</nav>
  </div>


  <!-- Contenu principal -->
  <div class="md:ml-64 p-6">
    <h1 class="text-2xl font-bold mb-6">Dashboard Utilisateur</h1>

    <!-- Box filtrantes -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 mb-6">
      <div id="box-actifs" class="shadow-lg bg-white text-center p-8 text-sm rounded-xl hov cursor-pointer">Membres Actifs: 0</div>
      <div id="box-bloques" class="shadow-lg bg-white text-center p-8 text-sm rounded-xl hov cursor-pointer">Membres Bloqués: 0</div>
      <div id="box-tous" class="shadow-lg bg-white text-center p-8 text-sm rounded-xl hov cursor-pointer">Total Effectif: 0</div>
    </div>

    <!-- Bouton Ajouter -->
    <div class="flex justify-end mb-4">
      <button id="openModal" class="bg-[#0A3545] text-white px-6 py-2 rounded-lg shadow hover:bg-[#145067]">Ajouter</button>
    </div>

    <!-- Tableau -->
    <div class="overflow-x-auto">
      <table class="table-auto w-full border rounded-xl shadow-lg text-sm">
        <thead class="bg-green-400 text-white">
          <tr>
            <th class="p-2">Membre</th>
            <th class="p-2">Date début</th>
            <th class="p-2">Seuil</th>
            <th class="p-2">Progression</th>
            <th class="p-2">Statut</th>
          </tr>
        </thead>
        <tbody id="table-body" class="text-center"></tbody>
      </table>
    </div>
  </div>

  <!-- Modal Ajouter Membre -->
  <div id="modal" class="fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center hidden">
    <div class="bg-white w-full max-w-[95%] sm:w-[500px] rounded-xl shadow-lg p-6 relative">
      <button id="closeModal" class="absolute top-2 right-2 text-gray-500 hover:text-black text-xl">✖</button>
      <h2 class="text-2xl font-bold text-center mb-6">Ajouter un membre</h2>

      <form id="formMembre" class="grid grid-cols-1 gap-4">
        <input type="text" id="nom" placeholder="Nom" class="w-full border rounded p-2">
        <input type="text" id="prenom" placeholder="Prénom" class="w-full border rounded p-2">
        <input type="date" id="dateDebut" class="w-full border rounded p-2">
        <select id="statut" class="w-full border rounded p-2">
          <option value="Actif">Actif</option>
          <option value="Bloqué">Bloqué</option>
        </select>
      </form>

      <div class="mt-4 text-center">
        <button id="ajouterMembre" class="bg-green-500 text-white px-6 py-2 rounded-lg shadow hover:bg-green-600">
          Ajouter
        </button>
      </div>
    </div>
  </div>

  <!-- Script JS -->
  <script type="module" src="/js/utilisateur.js"></script>
</body>
</html>
